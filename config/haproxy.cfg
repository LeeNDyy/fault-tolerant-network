defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 2s
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

resolvers docker
    nameserver embedded 127.0.0.11:53
    hold valid 5s

listen postgres
    bind :5432
    option httpchk GET /primary
    http-check expect status 200
    server pg1 pg1:5432 check port 8008 resolvers docker init-addr libc,none
    server pg2 pg2:5432 check port 8008 resolvers docker init-addr libc,none
    server pg3 pg3:5432 check port 8008 resolvers docker init-addr libc,none
